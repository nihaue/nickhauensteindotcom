<svg id="chart-pm" viewBox="0 -35 960 295" width="960" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="-35" width="960" height="295" fill="transparent"/>
      <defs>
        <!-- Arrow: neon cyan → hot pink -->
        <linearGradient id="grad-pm-arrow" x1="40" y1="0" x2="910" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00e5ff"/>
          <stop offset="100%" stop-color="#ff2e97"/>
        </linearGradient>
        <marker id="arrow-blue-pm" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#ff2e97"/>
        </marker>
        <!-- L0: cyberpunk magenta -->
        <linearGradient id="grad-pm-l0" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4a0e4e"/>
          <stop offset="100%" stop-color="#ff2e97"/>
        </linearGradient>
        <!-- L1: deep blue → neon cyan -->
        <linearGradient id="grad-pm-l1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e3a8a"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
        <!-- L2: sunset — deep indigo → warm coral -->
        <linearGradient id="grad-pm-l2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2d1b69"/>
          <stop offset="100%" stop-color="#f97316"/>
        </linearGradient>
        <!-- L3: aurora — deep teal → golden amber -->
        <linearGradient id="grad-pm-l3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0c4a4a"/>
          <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
        <!-- L4: purple → fuchsia -->
        <linearGradient id="grad-pm-l4" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="100%" stop-color="#e879f9"/>
        </linearGradient>
      </defs>
      <text x="480" y="-8" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle" font-style="italic">Hauenstein Model of Agentic Evolution</text>
      <!-- Level bands -->
      <rect x="40" y="40" width="172" height="130" rx="6" fill="url(#grad-pm-l0)" opacity="0.8"/>
      <rect x="222" y="40" width="172" height="130" rx="6" fill="url(#grad-pm-l1)" opacity="0.8"/>
      <rect x="404" y="40" width="172" height="130" rx="6" fill="url(#grad-pm-l2)" opacity="0.8"/>
      <rect x="586" y="40" width="172" height="130" rx="6" fill="url(#grad-pm-l3)" opacity="0.8"/>
      <rect x="768" y="40" width="172" height="130" rx="6" fill="url(#grad-pm-l4)" opacity="0.8"/>
      <!-- Level numbers -->
      <text x="56" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">Level 0</text>
      <text x="238" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">Level 1</text>
      <text x="420" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">Level 2</text>
      <text x="602" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">Level 3</text>
      <text x="784" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d1d9" font-weight="600">Level 4</text>
      <!-- Level names -->
      <text x="126" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">Vibe Coding</text>
      <text x="308" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">Structured Patterns</text>
      <text x="490" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="middle">Automated</text>
      <text x="490" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="middle">Orchestration</text>
      <text x="672" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">Governed Autonomy</text>
      <text x="854" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600" text-anchor="middle">Evolutionary Autonomy</text>
      <!-- Descriptions -->
      <text x="126" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Raw prompting, no structure</text>
      <text x="126" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human is driver</text>
      <text x="308" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Named methodology (RPI, SDD)</text>
      <text x="308" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human is operator</text>
      <text x="490" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Automated pipelines, quality gates</text>
      <text x="490" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human is reviewer</text>
      <text x="672" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human checkpoints, evidence</text>
      <text x="672" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human is arbitrator</text>
      <text x="854" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Process evolves itself</text>
      <text x="854" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">Human is objective-setter</text>
      <!-- Arrow -->
      <line x1="40" y1="200" x2="910" y2="200" stroke="url(#grad-pm-arrow)" stroke-width="3" marker-end="url(#arrow-blue-pm)"/>
      <text x="480" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#00e5ff" text-anchor="middle" font-weight="600">Axis #1: Process Maturity →</text>
    </svg>
